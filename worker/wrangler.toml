name = "ktf-member-portal-api"
main = "index.js"
compatibility_date = "2026-11-17"

[vars]
APP_ORIGIN = "https://YOUR-KTF-PROJECT.pages.dev"
API_ORIGIN = "https://ktf-member-portal-api.YOUR-SUBDOMAIN.workers.dev"
PAYU_ENV = "test"
FIREBASE_PROJECT_ID = "YOUR-FIREBASE-PROJECT-ID"
ADMIN_FIREBASE_UIDS = "REPLACE_WITH_ADMIN_FIREBASE_UID"

[[d1_databases]]
binding = "DB"
database_name = "ktf-member-portal"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
